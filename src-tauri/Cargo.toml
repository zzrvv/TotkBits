[package]
name = "Totkbits"
version = "0.0.9"
description = "A Tauri App"
authors = ["Banan039/SolidLink95"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# zstud-sys = {git = "https://github.com/SolidLink95/zstud-sys-rs"}
#BymlText
ryml = "0.3.2"
miow = "0.6.0"

regex = "1.10.4"
# glob = "0.3"
msbt_bindings_rs = {git = "https://github.com/SolidLink95/msbt_bindings_rs"}
# msbt_bindings_rs = {path = "W:/coding/msbt_bindings_rs"}
tauri = { version = "2.11.1", features = [] }
serde = { version = "1", features = ["derive"] }
# tauri-bundler = "1.5.1"
msyt = { git = "https://github.com/SolidLink95/msyt-lib" }
msbt = { git = "https://github.com/lojewalo/msbt-rs" }
zstd = "0.13.2"
updater = {path = "../ext_projects/updater"}
roead = { git = "https://github.com/SolidLink95/roead", features = ["yaml", "sarc", "byml"] }
# roead = { path = "./external/roead", features = ["yaml", "sarc", "byml"] }
# roead = { version = "1.0.0", features = ["yaml", "sarc", "byml"] }
#roead = { version = "0.25.1", features = ["yaml", "sarc", "byml"] }
serde_json = "1.0"
rfd = "0.15.1"
native-dialog = "0.7.0"
natord = "1.0.9"
bitvec = "1.0.1"
# rayon = "1"
#serde_derive = "1" 
serde_yaml = "0.9.32"
walkdir = "2"
byteordered = "0.6.0"
sha2 = "0.10"
digest = "0.10"
fs2 = "0.4"
base64 = "0.22.1"
restbl = { version = "0.1", features = ["yaml"] }
flate2 = "1.0.35"
windows = "0.58.0"
toml = "0.8.19"
winreg = "0.52.0"
reqwest = "0.12.12"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-fs = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-http = "2.5.9"
tauri-plugin-os = "2.3.2"

[dev-dependencies]
windows = "0.58.0"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"
# yaml = ["serde_yaml"]
